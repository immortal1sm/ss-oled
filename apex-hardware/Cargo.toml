[package]
name = "apex-hardware"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
usb = ["hidapi"]
async = []

[dependencies]
anyhow = "1.0.44"
bitvec = "1.0.1"
embedded-graphics = "0.8"
hidapi = { version = "1.2.6", optional = true }
# Already a dependency of the other workspace crates; needed so the reconnect
# wrapper can report when the panel drops and comes back.
log = "0.4"
num_enum = "0.5.4"
