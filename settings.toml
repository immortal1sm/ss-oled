# apex-tux / ss-oled settings example
#
# This file lives at ~/.config/apex-tux/settings.toml on the host.
# apex-tux looks for it there first, then in the current working directory.
#
# You can also override individual settings with APEX_<SECTION>__<KEY>
# environment variables (double underscore between section and key).

[interval]
# Global default: how long each provider sits on the OLED before rotating
# to the next one (in seconds). Set to 0 to disable auto-rotation entirely.
refresh = 30

# Per-provider overrides (optional). Lower values = shorter dwell.
# The clock lives on the system tray already, so it gets only a quick glance.
# clock = 5

[clock]
enabled = true
priority = 3                  # shown last in the rotation order
twelve_hour = false           # 24h format; set true for AM/PM

[mpris2]
enabled = true
priority = 1                  # shown first — most useful info on the OLED
# preferred_player omitted → auto-pick whichever MPRIS publisher appears first
# preferred_player = "spotify"

[sysinfo]
enabled = true
priority = 2
polling_interval = 1500       # ms between CPU/RAM/NET polls
net_load_max = 100            # MiB/s, scales the network bar fill
cpu_frequency_max = 5         # GHz, scales CPU frequency bar fill
temperature_max = 95          # °C, scales the temperature bar fill
net_interface_name = "enp6s0" # use `ip link` to find yours
sensor_name = "coretemp Package id 0"  # use `sensors` to find yours

[image]
# Static or animated GIF displayed as one of the cycling providers.
# Requires the binary to be built with `--features image`.
enabled = true
path = "images/sample_1.gif"

# NOTE: The MPRIS2 provider renders title (top), artist (second row), an
# elapsed/total timer centered between artist and the progress bar
# (e.g. "1:23 / 3:45"), and the progress bar at the bottom. Position and
# Length data come from MPRIS. If a player doesn't publish track length
# (e.g. Telegram, some browser tabs), only elapsed time is shown.
