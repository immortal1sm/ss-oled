[package]
name = "apex-input"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { version = "1.0.45", optional = true }
global-hotkey = { version = "0.2.0", optional = true }
tokio = { version = "1.13.0", features = ["sync"], optional = true }
log = { version = "0.4", optional = true }
dbus = { version = "0.9", optional = true }
dbus-tokio = { version = "0.7", optional = true }
futures = { version = "0.3", optional = true }

[features]
default = []
hotkeys = ["global-hotkey", "anyhow", "tokio", "log", "dbus", "dbus-tokio", "futures"]
